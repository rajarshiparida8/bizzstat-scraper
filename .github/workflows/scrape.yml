name: Manual News Scraper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scraper
        run: python BIZZStat.py

      - name: List files (for debugging)
        run: ls -l  # Debugging to check if news_output.json exists

      - name: Upload JSON output as artifact
        uses: actions/upload-artifact@v2
        with:
          name: news_output
          path: news_output.json

     
